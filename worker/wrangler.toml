name = "curie-id"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "curie-id"
database_id = "83fb8a9d-370a-4571-a20a-e1d6950e1b87"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 * * *"]   # daily cleanup at 03:00 UTC

[vars]
PBKDF2_ITERATIONS = "100000"   # measure with /admin/hash-timing, then raise if CPU allows
MIN_AGE = "13"
MAIL_FROM_NAME = "Curie ID"
MAIL_FROM_EMAIL = "curieid.app@gmail.com"   # must be a sender verified in Brevo
ALLOWED_ORIGIN = "https://curie-id.pages.dev"
APPS_JSON = '[{"clientId":"curie-example","name":"Curie example app","redirectUris":["https://curie-id.pages.dev/example/index.html","https://curie-id.pages.dev/example/","http://localhost:8080/example/index.html"]},{"clientId":"curie-store","name":"Curie Store","redirectUris":["https://rocurity.github.io/Curie-Store/store/","https://rocurity.github.io/Curie-Store/store/index.html","https://rocurity.github.io/Curie-Store/","https://rocurity.github.io/Curie-Store/index.html"]}]'
