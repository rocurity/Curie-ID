<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Curie ID admin</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;max-width:64rem;margin:0 auto;padding:1rem;color:#1c1a17;background:#f4efe6}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
  h1{font-family:Georgia,serif;font-weight:500;font-size:1.5rem;margin:0}
  h2{font-family:Georgia,serif;font-weight:500;font-size:1.2rem;margin:.2rem 0 .6rem}
  h3{font-size:1rem;margin:1rem 0 .4rem}
  .card{background:#fbf8f2;border:1px solid #d9d1c3;border-radius:6px;padding:1.2rem;margin-bottom:1rem}
  form.form{display:grid;gap:.7rem;max-width:22rem}
  label{display:grid;gap:.25rem;font-weight:500}
  input{font:inherit;padding:.5rem .6rem;border:1px solid #cfc5b3;border-radius:4px;background:#fff;flex:1;min-width:0}
  button{font:inherit;font-weight:600;padding:.5rem .9rem;border:0;border-radius:4px;background:#2d5b4e;color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:#1c1a17;border:1px solid #cfc5b3}
  button.danger{background:#9b2c1f}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid #e4dccd}
  tr[data-id]{cursor:pointer}
  tr[data-id]:hover{background:#f1ebdf}
  ul{list-style:none;padding:0;margin:0}
  li{padding:.35rem 0;border-bottom:1px solid #e4dccd}
  .muted{color:#6b645a}
  .tag{font-size:.8rem;padding:.1rem .5rem;border-radius:99px;border:1px solid #cfc5b3}
  .tag.active{color:#2d5b4e;border-color:#2d5b4e}
  .tag.suspended{color:#9b2c1f;border-color:#9b2c1f}
  .status{min-height:1.2em;font-size:.95rem}.status.bad{color:#9b2c1f}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Curie ID admin</h1>
  <button class="ghost" id="signout" hidden>Sign out</button>
</header>
<main id="app"></main>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
