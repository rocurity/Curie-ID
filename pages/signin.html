<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Curie ID</title>
<link rel="stylesheet" href="curie.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="signin.html">Curie ID</a>

    <form id="signin">
      <h1>Sign in</h1>
      <label>Curie ID, username or email
        <input name="identifier" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password"></label>
      <button>Sign in</button>
      <button type="button" class="ghost" id="forgot-open">Forgot password?</button>
      <p class="status" role="status"></p>
    </form>

    <form id="code" hidden>
      <h1>Enter your code</h1>
      <p id="code-text" class="muted"></p>
      <label>6-digit code
        <input name="code" inputmode="numeric" maxlength="6" required></label>
      <button>Confirm</button>
      <button type="button" class="ghost" id="code-cancel">Cancel</button>
      <p class="status" role="status"></p>
    </form>

    <form id="forgot" hidden>
      <h1>Reset password</h1>
      <p class="muted">Enter your Curie ID, username or email. If an account matches, we'll email a code.</p>
      <label>Curie ID, username or email
        <input name="identifier" required></label>
      <button>Send code</button>
      <p class="status" role="status"></p>
    </form>

    <form id="reset" hidden>
      <h1>Choose a new password</h1>
      <p class="muted">Enter the 6-digit code we emailed you, or one of your backup codes.</p>
      <label>6-digit code
        <input name="code" inputmode="numeric" maxlength="6"></label>
      <label>Or a backup code
        <input name="backupCode" autocomplete="off"></label>
      <label>New password
        <input name="newPassword" type="password" minlength="8" required autocomplete="new-password">
        <span class="hint">At least 8 characters, with letters and numbers.</span></label>
      <button>Set new password</button>
      <p class="status" role="status"></p>
    </form>
  </div>
</div>
<script src="config.js"></script>
<script src="curie.js"></script>
<script src="signin.js"></script>
</body>
</html>
