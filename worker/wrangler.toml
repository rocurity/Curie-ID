name = "curie-id"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "curie-id"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 * * *"]   # daily cleanup at 03:00 UTC

[vars]
PBKDF2_ITERATIONS = "100000"   # measure with /admin/hash-timing, then raise if CPU allows
MIN_AGE = "13"
MAIL_FROM_NAME = "Curie ID"
MAIL_FROM_EMAIL = "noreply@your-verified-domain.example"  # must be a sender verified in Brevo
ALLOWED_ORIGIN = "https://PASTE_YOUR_PAGES_ORIGIN_HERE"   # e.g. https://id.yourdomain.com
