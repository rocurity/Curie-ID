<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your Curie ID</title>
<link rel="stylesheet" href="curie.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="signin.html">Curie ID</a>

    <form id="signup">
      <h1>Create your Curie ID</h1>
      <p class="muted">One account for every app that uses Curie ID.</p>
      <label>Name
        <input name="displayName" maxlength="60" required autocomplete="name"></label>
      <label>Username
        <input name="username" pattern="[a-z0-9_]{3,20}" required autocomplete="username">
        <span class="hint">3 to 20 characters: lowercase letters, numbers and underscores.</span></label>
      <label>Email
        <input name="email" type="email" required autocomplete="email">
        <span class="hint">We send a confirmation code here.</span></label>
      <label>Date of birth
        <input name="dateOfBirth" type="date" required>
        <span class="hint">Used only to check your age. Never shown to other people or apps.</span></label>
      <label>Gender
        <select name="gender">
          <option value="">Prefer not to say</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="other">Other</option>
        </select>
        <span class="hint">Optional. Never shared with apps.</span></label>
      <label>Password
        <input name="password" type="password" minlength="8" required autocomplete="new-password">
        <span class="hint">At least 8 characters, with letters and numbers.</span></label>
      <label>Confirm password
        <input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label>
      <button class="wide">Create account</button>
      <p class="status" role="status"></p>
    </form>

    <form id="verify" hidden>
      <h1>Check your email</h1>
      <p id="sent" class="muted"></p>
      <label>6-digit code
        <input name="code" inputmode="numeric" maxlength="6" required></label>
      <button class="wide">Confirm email</button>
      <button type="button" class="ghost wide" id="resend">Send a new code</button>
      <p class="status" role="status"></p>
    </form>

    <div id="done" hidden></div>
  </div>
</div>
<script src="config.js"></script>
<script src="curie.js"></script>
<script src="signup.js"></script>
</body>
</html>
